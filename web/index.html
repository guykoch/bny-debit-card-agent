<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetX AI — debit card demo</title>
<!--
  Mock of the NetX AI chat panel in NetX360, for the debit card demo.
  It only displays what the server returns. Every decision is made server-side
  (core/guardrails.py); this page sends the advisor's text or the value of the
  button they clicked, and draws the reply.

  The copy / download / retry / speaker icons, the "+" and mic buttons, the
  menu, the expand icon and the "Guide Me" tab are drawn for realism only and
  do nothing.
-->
<style>
  :root {
    --bg: #F5F8FC; --border: #D5DDE8; --pill: #DCE6F4; --text: #2B2F36;
    --head: #1F2D4A; --blue: #2F5D9A; --blue-tint: #E8EFF9; --hint: #8A93A0;
    --icon: #4A4F57; --green: #2E7D5B; --green-tint: #EEF4F2; --red: #B03030;
    --red-tint: #FBEFEF; --red-line: #E3B5B5; --page: #E6EBF2; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--text);
    font-family: "Segoe UI", Calibri, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    /* Exactly one screen tall (dvh = the visible part on phones); the page never
       scrolls, only the messages inside the panel do. */
    height: 100vh; height: 100dvh; overflow: hidden; padding: 16px;
  }
  /* Auto margins centre the group when there is room and never push it off-screen. */
  #demo-slot { width: 100%; max-width: 440px; flex: none; margin-top: auto; }
  .panel {
    position: relative; width: 100%; max-width: 440px;
    flex: 1 1 auto; min-height: 0; max-height: 860px;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--bg) 100%);
    border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column; box-shadow: 0 8px 28px rgba(31,45,74,.12);
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px;
  }
  header .title { font-weight: 700; color: var(--head); font-size: 15px; white-space: nowrap; }
  .info { font-size: 12.5px; color: var(--head); background: var(--blue-tint); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; white-space: pre-line; }
  header .spark { width: 18px; height: 18px; color: #3A73C9; }
  header .grow { flex: 1; }
  header .icon { width: 18px; height: 18px; color: var(--text); opacity: .85; }
  .advisor {
    font: inherit; font-size: 12px; color: var(--head); background: var(--white);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; cursor: pointer;
  }
  .runtime {
    font-size: 11px; color: var(--hint); padding: 0 14px 6px; display: flex; gap: 6px; align-items: center;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); }
  .dot.ai { background: #3A73C9; }
  .msgs {
    flex: 1; overflow-y: auto; padding: 8px 30px 8px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .user {
    align-self: flex-end; max-width: 80%; background: var(--pill); color: var(--text);
    padding: 8px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; white-space: pre-wrap;
  }
  .bot { align-self: stretch; font-size: 14px; line-height: 1.45; }
  .bot .text { white-space: pre-wrap; }
  .tools { display: flex; gap: 14px; margin-top: 6px; color: var(--icon); }
  .tools svg { width: 16px; height: 16px; }
  .card {
    background: var(--white); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-top: 2px; max-width: 94%;
  }
  .card.danger { border-color: var(--red-line); }
  .card h4 { margin: 0 0 6px; font-size: 14px; color: var(--head); }
  .card .q { font-weight: 700; color: var(--head); margin-bottom: 8px; }
  .fields { margin: 0 0 8px; font-size: 13.5px; }
  .fields div { display: flex; gap: 8px; padding: 2px 0; }
  .fields span:first-child { color: var(--hint); min-width: 92px; }
  .warn { font-style: italic; font-size: 13px; color: var(--hint); margin-bottom: 8px; }
  .danger .warn { color: var(--red); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opts.stack { grid-template-columns: 1fr; }
  button.b {
    font: inherit; font-size: 13px; cursor: pointer; border-radius: 999px; padding: 6px 14px;
    border: 1px solid var(--border); background: var(--white); color: var(--hint);
  }
  button.b.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .danger button.b.primary { background: var(--red); border-color: var(--red); }
  button.b.alt { border-color: var(--blue); color: var(--blue); font-weight: 600; }
  button.b.opt {
    border-radius: 8px; border-color: var(--border); color: var(--blue); text-align: center; padding: 8px 10px;
  }
  button.b.opt.picked { background: var(--blue-tint); border: 1.5px solid var(--blue); font-weight: 600; }
  button.b:disabled { cursor: default; opacity: .55; }
  button.b.opt.picked:disabled, button.b.chosen:disabled { opacity: 1; }
  .hint { font-size: 11.5px; color: var(--hint); font-style: italic; }
  .dates { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .dates .dq { font-weight: 600; color: var(--head); font-size: 13px; margin-bottom: 8px; }
  .dates .row2 { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .dates label { display: flex; flex-direction: column; font-size: 12px; color: var(--hint); gap: 3px; }
  .dates .dl { display: flex; flex-direction: column; font-size: 12px; color: var(--hint); gap: 3px; }
  .udbtn { font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--white); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-width: 140px; justify-content: space-between; }
  .udbtn.empty { color: var(--hint); }
  .udbtn svg { width: 15px; height: 15px; opacity: .7; }
  .udbtn:disabled { cursor: default; opacity: .6; }
  .udpop { margin-top: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--white);
    padding: 8px; width: 238px; box-shadow: 0 6px 18px rgba(31,45,74,.12); }
  .udhead { display: flex; align-items: center; justify-content: space-between; font-weight: 600; color: var(--head); font-size: 13px; margin-bottom: 6px; }
  .udnav { border: 0; background: transparent; font-size: 20px; line-height: 1; cursor: pointer; color: var(--blue); padding: 0 8px; }
  .udgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .udwd { font-size: 11px; color: var(--hint); padding: 2px 0; }
  .udday { border: 0; background: transparent; border-radius: 6px; padding: 6px 0; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
  .udday:hover:not(:disabled) { background: var(--blue-tint); }
  .udday.on { background: var(--blue); color: #fff; font-weight: 600; }
  .udday:disabled { color: #C3CAD3; cursor: default; }
  @media (max-width: 600px) { .udbtn { font-size: 16px; } }
  .dates input { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); background: var(--white); }
  .dates .dh { font-size: 11.5px; color: var(--hint); margin-bottom: 8px; }
  .dates .dh.err { color: var(--red); }
  .notice { font-size: 12.5px; color: var(--red); margin-bottom: 8px; }
  .okline { display: flex; gap: 6px; color: var(--green); font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .okline svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
  .ack { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--text);
    margin: 4px 0 10px; cursor: pointer; }
  .ack input { margin-top: 2px; width: 16px; height: 16px; flex: none; }
  .addr input { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); background: var(--white); margin-bottom: 6px; }
  .addr .sugs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
  .addr .sug { text-align: left; border: 1px solid var(--border); border-radius: 8px; background: var(--white);
    padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; color: var(--text); }
  .addr .sug b { color: var(--head); font-weight: 600; }
  .addr .sug span { color: var(--hint); }
  .addr .sug:hover { border-color: var(--blue); background: var(--blue-tint); }
  .addr .pw { font-size: 10.5px; color: var(--hint); margin-bottom: 8px; }
  .addr .chosen { border: 1.5px solid var(--blue); background: var(--blue-tint); border-radius: 8px;
    padding: 6px 10px; margin-bottom: 6px; font-size: 13.5px; display: flex; flex-direction: column; gap: 2px; }
  .addr .chosen .lbl { font-size: 11px; color: var(--hint); }
  @media (max-width: 600px) { .addr input { font-size: 16px; } }
  .actbtn { font-weight: 600; color: var(--blue); border-color: var(--blue); }
  .cancelrow { margin-top: 8px; }
  button.b.cancel { color: var(--hint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-tint);
    border: 1px solid var(--blue); color: var(--head); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; }
  .chip button { border: 0; background: transparent; color: var(--hint); cursor: pointer; font-size: 14px; padding: 0 4px; }
  .field { margin-bottom: 8px; }
  .field .lbl { font-size: 12px; color: var(--hint); margin-bottom: 3px; }
  .field input, .field textarea { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: var(--white); }
  .field textarea { min-height: 54px; resize: vertical; }
  .field .err { font-size: 12px; margin-top: 3px; }
  @media (max-width: 600px) { .field input, .field textarea, .dates input { font-size: 16px; } }
  .done { display: flex; gap: 8px; align-items: flex-start; color: var(--green); font-weight: 600; }
  .done svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .err { color: var(--red); }
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--hint); animation: b 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .guide {
    position: absolute; right: -1px; top: 38%; background: var(--head); color: #fff;
    writing-mode: vertical-rl; font-size: 11px; font-weight: 700; padding: 10px 5px;
    border-radius: 6px 0 0 6px; user-select: none;
  }
  .composer { padding: 8px 14px 4px; }
  .box {
    background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px 6px;
  }
  .box textarea {
    width: 100%; border: 0; outline: 0; resize: none; font: inherit; font-size: 14px;
    color: var(--text); background: transparent; min-height: 22px; max-height: 120px;
  }
  .box .row { display: flex; align-items: center; gap: 10px; }
  .box .row .grow { flex: 1; }
  .box .row svg { width: 20px; height: 20px; }
  .plus { color: var(--blue); } .mic { color: var(--hint); }
  .send {
    width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--blue); color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .send:disabled { opacity: .5; cursor: default; }
  .send svg { width: 16px; height: 16px; }
  .note { font-size: 10.5px; color: var(--hint); text-align: center; padding: 6px 14px 10px; line-height: 1.35; }
  .below { font-size: 11px; color: #6B7684; margin-top: 10px; text-align: center; flex: none; margin-bottom: auto; }
  /* Actions menu: two groups (Do it now / Send a ticket) */
  .grp { margin-bottom: 10px; }
  .grp:last-of-type { margin-bottom: 0; }
  .grph { font-size: 12px; font-weight: 700; color: var(--head); text-transform: uppercase; letter-spacing: .04em;
    margin: 2px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: none; border: 0; padding: 0; width: 100%; font-family: inherit; cursor: default; }
  .grph .tw { display: none; color: var(--blue); font-size: 14px; }
  .grpn { font-size: 11.5px; color: var(--hint); margin: -2px 0 6px; }
  /* Admin menu and the Active Tickets panel */
  .admin { position: relative; }
  .admmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--white);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; width: 230px;
    box-shadow: 0 8px 22px rgba(31,45,74,.16); display: none; }
  .admmenu.open { display: block; }
  .admmenu .lbl { font-size: 11.5px; color: var(--hint); margin-bottom: 4px; }
  .admmenu select { width: 100%; margin-bottom: 10px; border-radius: 8px; padding: 5px 8px; }
  .admmenu button.b { width: 100%; }
  .sheet { position: absolute; inset: 0; z-index: 30; background: rgba(31,45,74,.28); border-radius: 12px;
    display: flex; align-items: flex-end; }
  .sheetin { background: var(--white); width: 100%; max-height: 82%; border-radius: 12px 12px 0 0;
    display: flex; flex-direction: column; box-shadow: 0 -6px 20px rgba(31,45,74,.18); }
  .sheethd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sheethd b { flex: 1; color: var(--head); font-size: 14px; }
  .sheethd button { border: 0; background: transparent; font-size: 20px; color: var(--hint); cursor: pointer; line-height: 1; }
  .sheetbd { overflow-y: auto; padding: 10px 14px 14px; font-size: 13px; }
  .trow { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 8px 6px; border-bottom: 1px solid #EDF1F6;
    cursor: pointer; border-radius: 6px; text-align: left; width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0; font: inherit; color: var(--text); }
  .trow:hover { background: var(--blue-tint); }
  .trow .sr { font-weight: 700; color: var(--blue); }
  .trow .st { font-size: 11.5px; color: var(--green); font-weight: 600; }
  .trow .sub { grid-column: 2 / 4; color: var(--hint); font-size: 12px; }
  .tdet .fields span:first-child { min-width: 120px; }
  .back { border: 0; background: transparent; color: var(--blue); cursor: pointer; font: inherit; font-size: 13px; padding: 0 0 8px; }
  /* Ticket cards */
  .crow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; padding: 8px 0; border-top: 1px dashed var(--border); }
  .crow:first-of-type { border-top: 0; padding-top: 0; }
  .crow .wide { grid-column: 1 / 3; display: flex; align-items: center; justify-content: space-between; }
  .crow input { width: 100%; font: inherit; font-size: 14px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; }
  .crow .lbl { font-size: 11.5px; color: var(--hint); margin-bottom: 2px; }
  .linkb { border: 0; background: transparent; color: var(--blue); cursor: pointer; font: inherit; font-size: 13px; padding: 2px 0; }
  .linkb.rm { color: var(--hint); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  .seg button { border: 0; background: var(--white); font: inherit; font-size: 12.5px; padding: 4px 12px; cursor: pointer; color: var(--hint); }
  .seg button.on { background: var(--blue); color: #fff; font-weight: 600; }
  .cbrow { display: flex; gap: 8px; }
  .cbrow input { font: inherit; font-size: 14px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; min-width: 0; }
  .cbrow .num { flex: 1; } .cbrow .ext { width: 70px; }
  .tform { font-size: 11.5px; color: var(--hint); margin: -2px 0 8px; }
  .rule { font-size: 12px; color: var(--red); margin: 6px 0 8px; }
  .tnote { font-size: 12px; color: var(--red); margin-bottom: 8px; }
  .allf { margin: 4px 0 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .atts { margin: 2px 0 8px; }
  .att { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 0; }
  .att span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att button { border: 0; background: transparent; color: var(--hint); cursor: pointer; font-size: 15px; }
  .att button.linkb { color: var(--blue); font-size: 13px; font-weight: 600; }
  .att span.err { flex: none; }
  .attnote { font-size: 11px; color: var(--hint); margin-top: 2px; }
  .rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-bottom: 8px; }
  .rcell .lbl { font-size: 11.5px; color: var(--hint); margin-bottom: 2px; }
  .rcell input, .rcell select, .rcell textarea { width: 100%; font: inherit; font-size: 14px; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--white); color: var(--text); }
  .rcell textarea { min-height: 54px; resize: vertical; }
  .rcell.wide { grid-column: 1 / 3; }
  .rcell .miss, .rcell .udate.miss .udbtn { border-color: var(--red); background: var(--red-tint); }
  .rcell .udbtn { width: 100%; }
  @media (max-width: 600px) { .rgrid { grid-template-columns: 1fr; } .rcell.wide { grid-column: 1; }
    .rcell input, .rcell select, .rcell textarea { font-size: 16px; } }
  @media (max-width: 600px) {
    .grp.collapsible .grph { cursor: pointer; }
    .grp.collapsible .grph .tw { display: inline; }
    .grp.collapsible.shut .opts, .grp.collapsible.shut .grpn { display: none; }
    .crow input, .cbrow input, .admmenu select { font-size: 16px; }
  }
  @media (max-width: 600px) {
    body { padding: 8px 8px max(8px, env(safe-area-inset-bottom)); }
    .panel { border-radius: 10px; }
    .below { display: none; }
    .msgs { padding-right: 26px; }
    /* 16px stops iPhone Safari from zooming in when you tap the box */
    .box textarea, .advisor { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="demo-slot"></div>
<div class="panel">
  <header>
    <svg class="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><path d="M5 2l.6 1.4L7 4l-1.4.6L5 6l-.6-1.4L3 4l1.4-.6z"/></svg>
    <span class="title">NetX AI</span>
    <span class="grow"></span>
    <button id="actions" class="advisor actbtn" title="Pick a card action">Actions</button>
    <div class="admin">
      <button id="adminbtn" class="advisor" title="Admin">Admin &#9662;</button>
      <div id="admmenu" class="admmenu">
        <div class="lbl">Advisor ID (signed-in advisor, mock)</div>
        <select id="advisor" class="advisor"></select>
        <button id="ticketsbtn" class="b alt">Active Tickets</button>
      </div>
    </div>
    <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
  </header>
  <div class="runtime"><span id="rdot" class="dot"></span><span id="rlabel">Connecting…</span></div>
  <div id="msgs" class="msgs" aria-live="polite"></div>
  <div class="guide">Guide Me</div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Ask NetX AI"></textarea>
      <div class="row">
        <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span class="grow"></span>
        <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <button id="send" class="send" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
    </div>
  </div>
  <div class="note">Please note: AI can make mistakes. You are responsible for verifying accuracy of responses. All data shown here is synthetic.</div>
</div>
<div class="below">Demo · mock clients and cards · nothing reaches a real bank system</div>

<script>
const ICONS = {
  tools: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
       + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
       + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>'
       + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
};
const WELCOME = "Hi, I can help with your clients' debit cards (lock, unlock, replace, report lost or stolen, travel notices) and send Service Center tickets (stop a check, a check copy, an address change, other requests). Type a request, or tap Actions.";

const $ = (id) => document.getElementById(id);
const msgs = $("msgs"), input = $("input"), sendBtn = $("send"), advisorSel = $("advisor");
let conversationId = null, busy = false;

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function scroll() { msgs.scrollTop = msgs.scrollHeight; }

function addUser(text) { msgs.appendChild(el("div", "user", esc(text))); scroll(); }

function addBot(inner, withTools = true) {
  const b = el("div", "bot");
  if (typeof inner === "string") b.appendChild(el("div", "text", esc(inner))); else b.appendChild(inner);
  if (withTools) b.appendChild(el("div", "tools", ICONS.tools));
  msgs.appendChild(b); scroll(); return b;
}

function lockCard(cardEl, chosenBtn) {
  cardEl.querySelectorAll("button").forEach(b => b.disabled = true);
  if (chosenBtn) chosenBtn.classList.add(chosenBtn.classList.contains("opt") ? "picked" : "chosen");
}

function renderChoice(card) {
  const c = el("div", "card");
  topLines(c, card);
  if (card.title) c.appendChild(el("h4", null, esc(card.title)));
  if (card.message) c.appendChild(el("div", "q", esc(card.message)));
  const all = card.actions || [];
  const acts = all.filter(a => a.style !== "cancel");
  function optList(list) {
    const longest = Math.max(0, ...list.map(a => a.label.length));
    const opts = el("div", "opts" + (list.length > 2 || longest > 22 ? " stack" : ""));
    list.forEach(a => {
      const btn = el("button", "b opt", esc(a.label));
      btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
      opts.appendChild(btn);
    });
    return opts;
  }
  if (card.groups) {                       // Actions menu: Do it now / Send a ticket
    Object.entries(card.groups).forEach(([g, name]) => {
      const list = acts.filter(a => a.group === g);
      if (!list.length) return;
      const box = el("div", "grp" + (g === "ticket" ? " collapsible shut" : ""));
      const h = el("button", "grph", `<span>${esc(name)}</span><span class="tw">&#9662;</span>`); h.type = "button";
      h.onclick = () => box.classList.toggle("shut");
      box.appendChild(h);
      const note = (card.group_notes || {})[g];
      if (note) box.appendChild(el("div", "grpn", esc(note)));
      box.appendChild(optList(list));
      c.appendChild(box);
    });
  } else c.appendChild(optList(acts));
  cancelRow(c, all);
  return c;
}

// P-12: every card has a Cancel button (its own row, under the options).
function cancelRow(c, actions, extra) {
  const row = el("div", "btns cancelrow");
  (extra || []).forEach(b => row.appendChild(b));
  (actions || []).filter(a => a.style === "cancel").forEach(a => {
    const btn = el("button", "b cancel", esc(a.label));
    btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
    row.appendChild(btn);
  });
  if (row.children.length) c.appendChild(row);
}

function cardHead(c, card) {
  topLines(c, card);
  if (card.title) c.appendChild(el("h4", null, esc(card.title)));
  if (card.message) c.appendChild(el("div", "q", esc(card.message)));
}

// A text field with suggestions fetched while typing. pick(s) is called with one suggestion.
function suggestField(input, box, url, show, pick) {
  let timer = null, seq = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const text = input.value.trim();
    if (text.length < 1) { box.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      try {
        const res = await fetch(url(text), { headers: demoHeaders() });
        const out = await res.json();
        if (mine !== seq) return;
        box.innerHTML = "";
        (out.suggestions || []).forEach(sg => {
          const b = el("button", "sug", show(sg));
          b.onclick = () => { if (!busy) pick(sg); };
          box.appendChild(b);
        });
        if (!(out.suggestions || []).length) box.appendChild(el("div", "hint", "No match yet - keep typing."));
      } catch (e) { box.innerHTML = ""; }
    }, 200);
  });
}

// P-16/P-17: "Which client?" - only this advisor's clients are suggested.
function renderClientInput(card) {
  const c = el("div", "card addr");
  cardHead(c, card);
  const q = el("input"); q.type = "text"; q.placeholder = "Start typing the client's name…"; q.autocomplete = "off";
  const sugs = el("div", "sugs");
  c.appendChild(q); c.appendChild(sugs);
  suggestField(q, sugs, t => `/api/clients/suggest?advisor=${encodeURIComponent(advisorSel.value)}&q=${encodeURIComponent(t)}`,
    sg => esc(sg.label), sg => { lockCard(c); q.disabled = true; send(`client_pick:${sg.id}`, sg.label.split(" · ")[0]); });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && q.value.trim() && !busy) { e.preventDefault(); lockCard(c); q.disabled = true; send(q.value.trim()); }
  });
  cancelRow(c, card.actions);
  setTimeout(() => q.focus(), 50);
  return c;
}

// Two date fields: From / To, no past dates, at most maxDays (both days counted).
function dateFields(parent, start, end, maxDays) {
  const today = isoLocal(new Date());
  const box = el("div", "dates",
    `<div class="row2"><div class="dl">From<span class="slot-ds"></span></div><div class="dl">To<span class="slot-de"></span></div></div>
     <div class="dh">Up to ${maxDays} days, no past dates.</div>`);
  const s = usDateBox("ds"), e = usDateBox("de"), h = box.querySelector(".dh");
  box.querySelector(".slot-ds").replaceWith(s); box.querySelector(".slot-de").replaceWith(e);
  s.min = today; e.min = today;
  if (start) s.value = start; if (end) e.value = end;
  function check() {
    h.className = "dh"; h.textContent = `Up to ${maxDays} days, no past dates.`;
    if (s.value) { e.min = s.value; e.max = addDays(s.value, maxDays - 1); }
    if (!s.value || !e.value) return false;
    if (s.value < today) { h.className = "dh err"; h.textContent = "The start date is in the past."; return false; }
    if (e.value < s.value) { h.className = "dh err"; h.textContent = "The end date is before the start date."; return false; }
    if (e.value > addDays(s.value, maxDays - 1)) { h.className = "dh err"; h.textContent = `A travel notice can cover at most ${maxDays} days.`; return false; }
    return true;
  }
  parent.appendChild(box);
  return { s, e, check, box };
}

// P-02/03/04/09: destinations (from BNY's list, with suggestions) and dates on one card.
function renderTravelForm(card) {
  const c = el("div", "card addr");
  cardHead(c, card);
  const max = card.max_destinations || 10;
  let dests = [...(card.destinations || [])];
  const fld = el("div", "field"); fld.appendChild(el("div", "lbl", `Destinations (countries or US states, up to ${max})`));
  const chips = el("div", "chips"), q = el("input"), sugs = el("div", "sugs");
  q.type = "text"; q.placeholder = "Type a country or US state…"; q.autocomplete = "off";
  fld.appendChild(chips); fld.appendChild(q); fld.appendChild(sugs); c.appendChild(fld);
  function drawChips() {
    chips.innerHTML = "";
    dests.forEach((d, i) => {
      const ch = el("span", "chip", esc(d)); const x = el("button", null, "×"); x.title = "Remove";
      x.onclick = () => { dests.splice(i, 1); drawChips(); valid(); };
      ch.appendChild(x); chips.appendChild(ch);
    });
    q.disabled = dests.length >= max;
    q.placeholder = dests.length >= max ? `Up to ${max} destinations` : "Type a country or US state…";
  }
  suggestField(q, sugs, t => `/api/places/suggest?q=${encodeURIComponent(t)}`, sg => esc(sg),
    sg => { if (!dests.includes(sg) && dests.length < max) dests.push(sg); q.value = ""; sugs.innerHTML = ""; drawChips(); valid(); q.focus(); });
  const df = dateFields(c, card.start, card.end, card.max_days || 14);
  const go = el("button", "b primary", "Continue");
  function valid() { const ok = dests.length > 0 && df.check(); go.disabled = !ok; return ok; }
  df.s.addEventListener("change", valid); df.e.addEventListener("change", valid);
  go.onclick = () => {
    if (busy || !valid()) return;
    lockCard(c, go); c.querySelectorAll("input").forEach(i => i.disabled = true);
    send("travel_form:" + JSON.stringify({ destinations: dests, start: df.s.value, end: df.e.value }),
         `${dests.join(", ")}, ${niceDate(df.s.value)} to ${niceDate(df.e.value)}`);
  };
  drawChips(); valid();
  cancelRow(c, card.actions, [go]);
  return c;
}

// P-11: one required text box (e.g. what "Other" means).
function renderTextInput(card) {
  const c = el("div", "card");
  cardHead(c, card);
  const fld = el("div", "field"), t = el("textarea");
  t.placeholder = card.placeholder || ""; t.maxLength = 200;
  fld.appendChild(t); c.appendChild(fld);
  const go = el("button", "b primary", esc(card.submit || "Continue"));
  const ok = () => t.value.trim().length >= 3;
  go.disabled = true; t.oninput = () => { go.disabled = !ok(); };
  go.onclick = () => { if (busy || !ok()) return; lockCard(c, go); t.disabled = true; send("text_input:" + t.value.trim(), t.value.trim()); };
  cancelRow(c, card.actions, [go]);
  setTimeout(() => t.focus(), 50);
  return c;
}

// F-22: Change dates opens a date-range picker inside the panel. Past dates are
// disabled and the end date can be at most max_days after the start (counting
// both days). The server checks the same rules again.
function isoLocal(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoLocal(d); }
function niceDate(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "numeric" }); }   // 11/20/2026

// F-53: our own date field, always MM/DD/YYYY (the browser's date input follows the
// computer's region, e.g. DD/MM/YYYY). Same interface as <input type="date">:
// .value / .min / .max are YYYY-MM-DD, and it fires "change".
function usDateBox(cls) {
  const w = el("div", "udate " + cls);
  const btn = el("button", "udbtn"); btn.type = "button";
  const pop = el("div", "udpop"); pop.style.display = "none";
  w.appendChild(btn); w.appendChild(pop);
  let val = "", mn = "", mx = "", view = null;
  const fmt = iso => iso ? `${iso.slice(5, 7)}/${iso.slice(8, 10)}/${iso.slice(0, 4)}` : "MM/DD/YYYY";
  const paint = () => { btn.innerHTML = esc(fmt(val)) + ICONS.cal; btn.classList.toggle("empty", !val); };
  function draw() {
    pop.innerHTML = "";
    const head = el("div", "udhead");
    const prev = el("button", "udnav", "&#8249;"), next = el("button", "udnav", "&#8250;");
    prev.type = next.type = "button";
    const title = el("span", null, view.toLocaleDateString("en-US", { month: "long", year: "numeric" }));
    prev.onclick = () => { view.setMonth(view.getMonth() - 1); draw(); };
    next.onclick = () => { view.setMonth(view.getMonth() + 1); draw(); };
    head.append(prev, title, next); pop.appendChild(head);
    const grid = el("div", "udgrid");
    "SMTWTFS".split("").forEach(d => grid.appendChild(el("span", "udwd", d)));
    const first = new Date(view.getFullYear(), view.getMonth(), 1, 12);
    for (let i = 0; i < first.getDay(); i++) grid.appendChild(el("span"));
    const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const iso = isoLocal(new Date(view.getFullYear(), view.getMonth(), d, 12));
      const b = el("button", "udday" + (iso === val ? " on" : ""), String(d)); b.type = "button";
      b.disabled = (mn && iso < mn) || (mx && iso > mx);
      b.onclick = () => { val = iso; paint(); pop.style.display = "none"; w.dispatchEvent(new Event("change")); };
      grid.appendChild(b);
    }
    pop.appendChild(grid);
  }
  btn.onclick = () => {
    if (pop.style.display !== "none") { pop.style.display = "none"; return; }
    const base = val || mn || isoLocal(new Date());
    view = new Date(+base.slice(0, 4), +base.slice(5, 7) - 1, 1, 12);
    draw(); pop.style.display = "";
    pop.scrollIntoView({ block: "nearest" });
  };
  Object.defineProperty(w, "value", { get: () => val, set: v => { val = v || ""; paint(); } });
  Object.defineProperty(w, "min", { get: () => mn, set: v => { mn = v || ""; } });
  Object.defineProperty(w, "max", { get: () => mx, set: v => { mx = v || ""; } });
  paint();
  return w;
}

function datePicker(cardEl, d) {
  const old = cardEl.querySelector(".dates");
  if (old) { old.remove(); return; }
  const max = d.max_days || 14, today = isoLocal(new Date());
  const box = el("div", "dates",
    `<div class="dq">Pick the travel dates</div>
     <div class="row2"><div class="dl">From<span class="slot-ds"></span></div><div class="dl">To<span class="slot-de"></span></div></div>
     <div class="dh">Up to ${max} days, no past dates.</div>`);
  const s = usDateBox("ds"), e = usDateBox("de"), h = box.querySelector(".dh");
  box.querySelector(".slot-ds").replaceWith(s); box.querySelector(".slot-de").replaceWith(e);
  s.min = today; s.value = d.start && d.start >= today ? d.start : today;
  function sync() {
    if (!s.value || s.value < today) s.value = today;
    e.min = s.value; e.max = addDays(s.value, max - 1);
    if (!e.value || e.value < e.min) e.value = d.end && d.end >= e.min && d.end <= e.max ? d.end : e.min;
    if (e.value > e.max) e.value = e.max;
    h.className = "dh"; h.textContent = `Up to ${max} days, no past dates.`;
  }
  s.onchange = sync; e.onchange = sync; sync();
  const use = el("button", "b primary", "Use these dates");
  use.onclick = () => {
    if (busy) return;
    if (!s.value || !e.value || e.value < s.value) { h.className = "dh err"; h.textContent = "Pick a start and an end date."; return; }
    lockCard(cardEl, use);
    send(`set_dates:${s.value}:${e.value}`, `New dates: ${niceDate(s.value)} to ${niceDate(e.value)}`);
  };
  box.appendChild(use);
  cardEl.appendChild(box);
  box.scrollIntoView({ block: "nearest" });
}

function topLines(c, card) {
  if (card.note) c.appendChild(el("div", "okline", ICONS.check + `<span>${esc(card.note)}</span>`));
  if (card.notice) c.appendChild(el("div", "notice", esc(card.notice)));
  if (card.info) c.appendChild(el("div", "info", esc(card.info)));
}

// Address field with suggestions while typing (US + territories). The server
// looks the picked address up again; the browser only sends the suggestion id.
function renderAddress(card) {
  const c = el("div", "card addr");
  topLines(c, card);
  if (card.title) c.appendChild(el("h4", null, esc(card.title)));
  if (card.message) c.appendChild(el("div", "q", esc(card.message)));
  const q = el("input"); q.type = "text"; q.placeholder = "Start typing an address…"; q.autocomplete = "off";
  const sugs = el("div", "sugs"), pw = el("div", "pw", "");
  const chosen = el("div", "chosen"); chosen.style.display = "none";
  const apt = el("input"); apt.type = "text"; apt.placeholder = "Apt, suite, unit (optional)"; apt.autocomplete = "off";
  c.appendChild(q); c.appendChild(sugs); c.appendChild(pw); c.appendChild(chosen); c.appendChild(apt);
  const session = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[^a-zA-Z0-9-]/g, "");
  let timer = null, seq = 0, picked = null;
  // P2-03: picking a suggestion only selects it; the unit can still be typed, then "Use this address".
  const use = el("button", "b primary", "Use this address"); use.disabled = true;
  const change = el("button", "b", "Change"); change.style.display = "none";
  function select(sg) {
    picked = sg;
    chosen.innerHTML = `<span class="lbl">Selected address</span><b>${esc(sg.text)}</b>`;
    chosen.style.display = ""; q.style.display = "none"; sugs.innerHTML = ""; pw.textContent = "";
    change.style.display = ""; use.disabled = false;
    setTimeout(() => apt.focus(), 30);
  }
  change.onclick = () => {
    if (busy) return;
    picked = null; chosen.style.display = "none"; q.style.display = ""; change.style.display = "none";
    use.disabled = true; q.focus(); q.dispatchEvent(new Event("input"));
  };
  use.onclick = () => {
    if (busy || !picked) return;
    const unit = apt.value.trim().replace(/[|]/g, " ");
    lockCard(c, use); apt.disabled = true; q.disabled = true;
    send(`address_pick:${picked.id}|${unit}`, picked.text + (unit ? ` (${unit})` : ""));
  };
  q.oninput = () => {
    clearTimeout(timer);
    const text = q.value.trim();
    if (text.length < 3) { sugs.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      try {
        const res = await fetch(`/api/address/suggest?q=${encodeURIComponent(text)}&session=${session}`, { headers: demoHeaders() });
        const out = await res.json();
        if (mine !== seq || picked) return;
        sugs.innerHTML = "";
        pw.textContent = out.provider === "google" ? "Suggestions powered by Google" : "Demo address list";
        if (!(out.suggestions || []).length) { sugs.appendChild(el("div", "hint", "No matching US address yet - keep typing.")); return; }
        out.suggestions.forEach(sg => {
          const b = el("button", "sug", `<b>${esc(sg.main || sg.text)}</b> <span>${esc(sg.secondary || "")}</span>`);
          b.onclick = () => { if (!busy) select(sg); };
          sugs.appendChild(b);
        });
      } catch (e) { sugs.innerHTML = ""; sugs.appendChild(el("div", "hint", "Address search is not available right now.")); }
    }, 250);
  };
  const btns = el("div", "btns");
  btns.appendChild(use); btns.appendChild(change);
  (card.actions || []).forEach(a => {
    const btn = el("button", "b cancel", esc(a.label));
    btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
    btns.appendChild(btn);
  });
  c.appendChild(btns);
  if (card.prefill) { q.value = card.prefill; setTimeout(() => q.dispatchEvent(new Event("input")), 50); }   // P2-05
  setTimeout(() => q.focus(), 50);
  return c;
}

function renderConfirm(card) {
  const c = el("div", "card" + (card.danger ? " danger" : ""));
  topLines(c, card);
  c.appendChild(el("h4", null, esc(card.title)));
  const inlineDates = card.dates && card.dates.inline;
  const f = el("div", "fields");
  (card.fields || []).filter(x => !(inlineDates && x.label === "Dates"))
    .forEach(x => f.appendChild(el("div", null, `<span>${esc(x.label)}</span><span>${esc(x.value)}</span>`)));
  c.appendChild(f);
  let df = null, reason = null, reasonErr = null, tick = null;
  if (inlineDates) df = dateFields(c, card.dates.start, card.dates.end, card.dates.max_days || 14);   // P-14
  if (card.text_input) {                            // P-06: required, editable text box
    const ti = card.text_input, fld = el("div", "field");
    fld.appendChild(el("div", "lbl", esc(ti.label) + (ti.required ? " (required)" : "")));
    reason = el("input"); reason.type = "text"; reason.maxLength = 200;
    reason.placeholder = ti.placeholder || ""; reason.value = ti.value || "";
    reasonErr = el("div", "err");
    fld.appendChild(reason); fld.appendChild(reasonErr); c.appendChild(fld);
  }
  if (card.warning) c.appendChild(el("div", "warn", esc(card.warning)));
  if (card.ack) {                                   // a box the advisor must tick first
    const lab = el("label", "ack");
    tick = el("input"); tick.type = "checkbox";
    lab.appendChild(tick); lab.appendChild(el("span", null, esc(card.ack)));
    c.appendChild(lab);
  }
  const btns = el("div", "btns");
  (card.actions || []).forEach(a => {
    const cls = a.style === "primary" ? "primary" : a.style === "alternative" ? "alt" : "";
    const btn = el("button", "b " + cls, esc(a.label));
    if (a.value === "change_dates" && card.dates) btn.onclick = () => { if (!busy) datePicker(c, card.dates); };
    else if (a.value === "confirm" && (tick || reason || df)) {
      const ready = () => (!tick || tick.checked) && (!reason || reason.value.trim().length >= 3)
                          && (!df || df.check());
      btn.disabled = !ready();
      [tick, reason, df && df.s, df && df.e].forEach(x => x && x.addEventListener(x === reason ? "input" : "change",
                                                                                 () => { btn.disabled = !ready(); }));
      btn.onclick = () => {
        if (busy || !ready()) return;
        const extra = {};
        if (tick) extra.ack = true;
        if (reason) extra.reason = reason.value.trim();
        if (df) { extra.start = df.s.value; extra.end = df.e.value; }
        lockCard(c, btn); c.querySelectorAll("input").forEach(i => i.disabled = true);
        send("confirm_with:" + JSON.stringify(extra), a.label);
      };
    }
    else btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
    btns.appendChild(btn);
  });
  btns.appendChild(el("span", "hint", "nothing has run yet"));
  c.appendChild(btns);
  return c;
}

// ------------------------------------------------------------ Service Center tickets
// The page only collects values; the server checks every one again.
function inputBox(ph, val, cls) {
  const i = el("input", cls || null); i.type = "text"; i.autocomplete = "off";
  i.placeholder = ph || ""; i.value = val || ""; return i;
}
function moneyOk(v) { return /^\$?\s*\d{1,3}(,?\d{3})*(\.\d{1,2})?$/.test(String(v).trim()) && parseFloat(String(v).replace(/[$,\s]/g, "")) > 0; }

// Check #, Amount, Date Written rows (+ Add another check).
function renderCheckForm(card) {
  const c = el("div", "card addr");
  cardHead(c, card);
  const list = el("div"); c.appendChild(list);
  const max = card.max_rows || 1, needAmt = !!card.amount_required;
  const rows = [];
  const err = el("div", "dh err"); err.style.fontSize = "12px";
  function addRow(r) {
    r = r || {};
    const box = el("div", "crow");
    const num = inputBox("e.g. 1043", r.check_number), amt = inputBox(needAmt ? "e.g. 250.00" : "optional", r.amount);
    num.inputMode = "numeric"; amt.inputMode = "decimal";
    const date = usDateBox("cd"); date.max = isoLocal(new Date()); if (r.date_written) date.value = r.date_written;
    const f1 = el("div"), f2 = el("div"), f3 = el("div", "wide");
    f1.append(el("div", "lbl", "Check #"), num);
    f2.append(el("div", "lbl", "Amount" + (needAmt ? "" : " (optional)")), amt);
    const dwrap = el("div"); dwrap.append(el("div", "lbl", "Date written (optional)"), date);
    f3.appendChild(dwrap);
    const row = { box, num, amt, date };
    if (rows.length) {
      const rm = el("button", "linkb rm", "Remove"); rm.type = "button";
      rm.onclick = () => { rows.splice(rows.indexOf(row), 1); box.remove(); more.style.display = rows.length < max ? "" : "none"; valid(); };
      f3.appendChild(rm);
    }
    box.append(f1, f2, f3); list.appendChild(box); rows.push(row);
    [num, amt].forEach(x => x.addEventListener("input", valid));
    more.style.display = rows.length < max ? "" : "none";
  }
  const more = el("button", "linkb", "+ Add another check"); more.type = "button";
  more.onclick = () => { if (rows.length < max) { addRow(); valid(); } };
  (card.rows && card.rows.length ? card.rows : [{}]).slice(0, max).forEach(addRow);
  c.appendChild(more); c.appendChild(err);
  const go = el("button", "b primary", "Continue");
  function valid() {
    err.textContent = "";
    const ok = rows.every(r => /^\d{1,10}$/.test(r.num.value.trim()) &&
      (r.amt.value.trim() ? moneyOk(r.amt.value) : !needAmt));
    const bad = rows.find(r => r.amt.value.trim() && !moneyOk(r.amt.value));
    if (bad) err.textContent = "The amount must be a dollar amount, e.g. 250.00.";
    go.disabled = !ok; return ok;
  }
  go.onclick = () => {
    if (busy || !valid()) return;
    const out = rows.map(r => ({ check_number: r.num.value.trim(), amount: r.amt.value.trim().replace(/[$,\s]/g, ""), date_written: r.date.value }));
    lockCard(c, go); c.querySelectorAll("input").forEach(i => i.disabled = true);
    send("check_form:" + JSON.stringify({ rows: out }), out.map(r => `Check ${r.check_number}` + (r.amount ? ` $${r.amount}` : "")).join("; "));
  };
  valid();
  cancelRow(c, card.actions, [go]);
  setTimeout(() => rows[0] && rows[0].num.focus(), 50);
  return c;
}

// Call Back #: US 3-3-4 + extension, or Non-US.
function callbackFields(parent, value) {
  let kind = (value && value.kind) === "Non-US" ? "Non-US" : "US";
  const seg = el("div", "seg"), us = el("button", null, "US"), nonus = el("button", null, "Non-US");
  us.type = nonus.type = "button"; seg.append(us, nonus);
  const row = el("div", "cbrow");
  const num = inputBox("", value && value.number, "num"), ext = inputBox("Ext", value && value.ext, "ext");
  num.inputMode = "tel"; ext.inputMode = "numeric";
  row.append(num, ext);
  const hint = el("div", "dh"); hint.style.fontSize = "11.5px"; hint.style.marginTop = "4px";
  function paint() {
    us.classList.toggle("on", kind === "US"); nonus.classList.toggle("on", kind === "Non-US");
    num.placeholder = kind === "US" ? "xxx-xxx-xxxx" : "+44 20 7946 0000";
    ext.style.display = kind === "US" ? "" : "none";
    hint.textContent = kind === "US" ? "10 digits, e.g. 212-555-0142." : "6 to 15 digits, with the country code.";
  }
  num.addEventListener("input", () => {
    if (kind !== "US") return;
    const d = num.value.replace(/\D/g, "").slice(0, 10);
    num.value = d.length > 6 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d;
  });
  us.onclick = () => { kind = "US"; paint(); num.dispatchEvent(new Event("input")); };
  nonus.onclick = () => { kind = "Non-US"; paint(); num.dispatchEvent(new Event("input")); };
  parent.append(seg, row, hint); paint();
  return {
    num, ext,
    ok: () => { const d = num.value.replace(/\D/g, ""); return kind === "US" ? d.length === 10 : d.length >= 6 && d.length <= 15; },
    value: () => ({ kind, number: num.value.trim(), ext: kind === "US" ? ext.value.replace(/\D/g, "") : "" })
  };
}

function renderTicketAddress(card) {
  const c = el("div", "card addr");

  const sugs = el("div", "sugs"), pw = el("div", "pw", "");

  phoneF.append(el("div", "lbl", "New phone #"), phone);
  c.append(q, sugs, pw, chosen, apt, change, phoneF);
  const session = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[^a-zA-Z0-9-]/g, "");
  let timer = null, seq = 0, picked = null;
  const go = el("button", "b primary", "Continue");
  const valid = () => { const ok = !!picked || phone.value.replace(/\D/g, "").length >= 10; go.disabled = !ok; return ok; };
  function select(sg) {
    picked = sg;
    chosen.innerHTML = `<span class="lbl">Selected address</span><b>${esc(sg.text)}</b>`;
    chosen.style.display = ""; q.style.display = "none"; sugs.innerHTML = ""; pw.textContent = "";
    change.style.display = ""; valid(); setTimeout(() => apt.focus(), 30);
  }
  change.onclick = () => { picked = null; chosen.style.display = "none"; q.style.display = ""; change.style.display = "none"; valid(); q.focus(); q.dispatchEvent(new Event("input")); };
  q.oninput = () => {
    clearTimeout(timer);
    const text = q.value.trim();
    if (text.length < 3) { sugs.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      try {
        const res = await fetch(`/api/address/suggest?q=${encodeURIComponent(text)}&session=${session}`, { headers: demoHeaders() });
        const out = await res.json();
        if (mine !== seq || picked) return;
        sugs.innerHTML = "";
        pw.textContent = out.provider === "google" ? "Suggestions powered by Google" : "Demo address list";
        if (!(out.suggestions || []).length) { sugs.appendChild(el("div", "hint", "No matching US address yet - keep typing.")); return; }
        out.suggestions.forEach(sg => {
          const b = el("button", "sug", `<b>${esc(sg.main || sg.text)}</b> <span>${esc(sg.secondary || "")}</span>`);
          b.onclick = () => { if (!busy) select(sg); };
          sugs.appendChild(b);
        });
      } catch (e) { sugs.innerHTML = ""; sugs.appendChild(el("div", "hint", "Address search is not available right now.")); }
    }, 250);
  };
  phone.addEventListener("input", valid);
  go.onclick = () => {
    if (busy || !valid()) return;
    const unit = apt.value.trim();
    lockCard(c, go); c.querySelectorAll("input").forEach(i => i.disabled = true);
    const shown = [picked ? picked.text + (unit ? ` (${unit})` : "") : "", phone.value.trim()].filter(Boolean).join(" · ");
    send("ticket_address:" + JSON.stringify({ pick: picked ? picked.id : "", unit, phone: phone.value.trim() }), shown);
  };
  valid();
  cancelRow(c, card.actions, [go]);
  if (card.prefill) setTimeout(() => q.dispatchEvent(new Event("input")), 50);
  setTimeout(() => q.focus(), 50);
  return c;
}

// Retail Check Deposit Status Inquiry (rollover check): one card laid out like BNY's form.
// Filled from the advisor's words; missing required fields are outlined in red.
function renderRolloverForm(card) {
  const c = el("div", "card addr");
  cardHead(c, card);
  const v = card.values || {}, missing = new Set(card.missing || []), box = {};
  const grid = el("div", "rgrid");
  function cell(f, input, wide) {
    const w = el("div", "rcell" + (wide ? " wide" : ""));
    w.appendChild(el("div", "lbl", esc(f.label) + (f.required ? " *" : "")));
    w.appendChild(input);
    if (missing.has(f.label)) input.classList.add("miss");
    if (f.hint) w.appendChild(el("div", "attnote", esc(f.hint)));
    grid.appendChild(w); return w;
  }
  function select(opts, val, blank) {
    const sel = el("select", "rsel");
    if (blank) sel.appendChild(new Option(blank, ""));
    opts.forEach(o => sel.appendChild(new Option(o, o, false, o === val)));
    if (val && !opts.includes(val)) sel.value = "";
    return sel;
  }
  const byId = {}; (card.form_fields || []).forEach(f => byId[f.id] = f);
  let trackCell = null, lockSel = null;
  (card.form_fields || []).forEach(f => {
    let inp;
    if (f.id === "delivery_method") {
      inp = select(f.options, v[f.id], "Select…");
      inp.onchange = () => { trackCell.style.display = inp.value === "Overnight" ? "" : "none"; valid(); };
    } else if (f.id === "destination") {
      inp = select(f.options, v[f.id], "Select…");
      inp.onchange = () => { fillLock(); valid(); };
    } else if (f.id === "lockbox") {
      inp = lockSel = el("select", "rsel");
    } else if (f.id === "date_sent") {
      inp = usDateBox("rd"); inp.max = isoLocal(new Date()); if (v[f.id]) inp.value = v[f.id];
      inp.addEventListener("change", valid);
    } else if (f.id === "additional_info") {
      inp = el("textarea"); inp.maxLength = 1000; inp.value = v[f.id] || "";
    } else {
      inp = inputBox(f.id === "amount" ? "e.g. 142300.00" : "", v[f.id]);
      if (f.id === "amount") inp.inputMode = "decimal";
      if (f.suggestions) {
        const dl = el("datalist"); dl.id = "dl-" + Math.random().toString(36).slice(2);
        f.suggestions.forEach(x => dl.appendChild(new Option(x, x))); c.appendChild(dl);
        inp.setAttribute("list", dl.id);
      }
      inp.addEventListener("input", valid);
    }
    box[f.id] = inp;
    const w = cell(f, inp, f.id === "additional_info");
    if (f.id === "tracking_number") { trackCell = w; w.style.display = v.delivery_method === "Overnight" ? "" : "none"; }
  });
  function fillLock() {
    if (!lockSel) return;
    const opts = ((byId.lockbox || {}).options_by_destination || {})[box.destination.value] || [];
    const keep = lockSel.value || v.lockbox;
    lockSel.innerHTML = ""; opts.forEach(o => lockSel.appendChild(new Option(o, o, false, o === keep)));
    lockSel.disabled = !opts.length;
  }
  fillLock();
  c.appendChild(grid);
  const err = el("div", "dh err"); err.style.fontSize = "12px"; c.appendChild(err);
  const go = el("button", "b primary", "Continue");
  function value(id) { const x = box[id]; return x ? String(x.value || "").trim() : ""; }
  function valid() {
    const need = ["amount", "check_number", "delivery_method", "date_sent", "destination"];
    if (value("delivery_method") === "Overnight") need.push("tracking_number");
    const miss = need.filter(id => !value(id));
    const amtBad = value("amount") && !moneyOk(value("amount"));
    need.forEach(id => box[id] && box[id].classList.toggle("miss", !value(id)));
    err.textContent = amtBad ? "The amount must be a dollar amount, e.g. 142300.00." : "";
    go.disabled = miss.length > 0 || amtBad; return !go.disabled;
  }
  go.onclick = () => {
    if (busy || !valid()) return;
    const out = {}; Object.keys(box).forEach(id => out[id] = value(id));
    out.amount = out.amount.replace(/[$,\s]/g, "");
    lockCard(c, go); c.querySelectorAll("input, select, textarea").forEach(i => i.disabled = true);
    send("rollover_form:" + JSON.stringify(out),
         `Check ${out.check_number} · $${Number(out.amount).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}, ${out.delivery_method}, sent ${niceDate(out.date_sent)}, to ${out.destination}`);
  };
  valid();
  cancelRow(c, card.actions, [go]);
  return c;
}

// Attachments: the browser asks where to upload, sends the file there, and keeps
// only the storage id. Files never go to the AI. The server checks them again on Send.
async function uploadFile(file) {
  const r1 = await fetch("/api/tickets/upload-url", { method: "POST", headers: demoHeaders() });
  const t = await r1.json();
  if (!t.url) throw new Error("no upload url");
  const local = t.url.startsWith("/");
  const r2 = await fetch(t.url, { method: "POST", headers: { "Content-Type": file.type, ...(local ? demoHeaders() : {}) }, body: file });
  const out = await r2.json();
  if (!out.storageId) throw new Error(out.message || "upload failed");
  return out.storageId;
}

// The short ticket review card: key fields, Show all fields, + Attach file, Send.
function renderTicketReview(card) {
  const t = card.ticket, ed = t.editable || {};
  const c = el("div", "card");
  topLines(c, card);
  c.appendChild(el("h4", null, esc(t.title)));
  if (t.form) c.appendChild(el("div", "tform", esc(t.form)));
  const f = el("div", "fields");
  (t.key || []).forEach(x => f.appendChild(el("div", null, `<span>${esc(x.label)}</span><span>${esc(x.value)}</span>`)));
  const cbLine = el("div"); f.appendChild(cbLine);
  c.appendChild(f);
  (t.warnings || []).forEach(w => c.appendChild(el("div", "tnote", esc(w))));
  if (t.note) c.appendChild(el("div", "tnote", esc(t.note)));

  // Show all fields: the whole form, with Subject / Additional Information / Call Back # editable.
  const all = el("div", "allf"); all.style.display = "none";
  const fa = el("div", "fields");
  (t.all || []).filter(x => !["Subject", "Additional Information", "Call Back #"].includes(x.label))

  all.appendChild(fa);
  const subjF = el("div", "field"), subj = inputBox("Subject", ed.subject); subj.maxLength = 120;
  subjF.append(el("div", "lbl", "Subject" + (ed.subject_required ? " (required)" : " (optional)")), subj);
  if (ed.has_subject === false) subjF.style.display = "none";   // e.g. the rollover form
  const infoF = el("div", "field"), info = el("textarea"); info.maxLength = 1000; info.value = ed.additional_info || "";
  infoF.append(el("div", "lbl", "Additional Information" + (ed.info_required ? " (required)" : " (optional)")), info);
  // Call Back #: prefilled from the advisor's profile; Change opens the fields right here.
  const cbF = el("div", "field"); cbF.style.display = "none";
  cbF.appendChild(el("div", "lbl", "Call Back # (saved for your next tickets)"));
  const cb = callbackFields(cbF, ed.callback);
  f.after(cbF);
  all.append(subjF, infoF);
  if (t.rule) all.appendChild(el("div", "rule", esc(t.rule)));
  c.appendChild(all);
  function paintCb() {
    const v = cb.value();
    cbLine.innerHTML = `<span>Call Back #</span><span>${esc(v.number ? v.number + (v.ext ? " ext " + v.ext : "") : "(required)")}</span>`;
    const ch = el("button", "linkb", cbF.style.display === "none" ? "Change" : "Done"); ch.type = "button";
    ch.style.marginLeft = "8px";
    ch.onclick = () => {
      if (cbF.style.display !== "none" && !cb.ok()) return;      // keep it open until valid
      cbF.style.display = cbF.style.display === "none" ? "" : "none"; paintCb();
      if (cbF.style.display === "") cb.num.focus();
    };
    cbLine.lastChild.appendChild(ch);
  }

  // Attachments
  const ac = t.attachments || { max: 5, max_mb: 10, types: "PDF, JPG or PNG" };
  let files = (ac.files || []).map(x => ({ storage_id: x.storage_id, name: x.name }));
  const atts = el("div", "atts"), attErr = el("div", "dh err"); attErr.style.fontSize = "12px";
  const picker = el("input"); picker.type = "file"; picker.accept = ".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png";
  picker.multiple = true; picker.style.display = "none";
  const attach = el("button", "linkb", "+ Attach file"); attach.type = "button";
  let uploading = 0;
  function drawAtts() {
    atts.innerHTML = "";
    files.forEach((x, i) => {
      const row = el("div", "att", `<span>Attached: ${esc(x.name)}</span>`);
      const rm = el("button", null, "×"); rm.title = "Remove"; rm.type = "button";
      rm.onclick = () => { files.splice(i, 1); drawAtts(); };
      row.appendChild(rm); atts.appendChild(row);
    });
    if (uploading) atts.appendChild(el("div", "hint", "Uploading…"));
    attach.style.display = files.length + uploading < ac.max ? "" : "none";
    valid();
  }
  attach.onclick = () => { if (!busy) picker.click(); };
  picker.onchange = async () => {
    attErr.textContent = "";
    for (const file of Array.from(picker.files || [])) {
      if (files.length + uploading >= ac.max) { attErr.textContent = `At most ${ac.max} files.`; break; }
      if (!/^(application\/pdf|image\/jpeg|image\/png)$/.test(file.type)) { attErr.textContent = `${file.name}: only ${ac.types} files.`; continue; }
      if (file.size > ac.max_mb * 1024 * 1024) { attErr.textContent = `${file.name} is over ${ac.max_mb} MB.`; continue; }
      uploading++; drawAtts();
      try { files.push({ storage_id: await uploadFile(file), name: file.name }); }
      catch (e) { attErr.textContent = `${file.name} could not be uploaded. Please try again.`; }
      uploading--; drawAtts();
    }
    picker.value = "";
  };
  c.append(atts, picker, attErr);
  const attRow = el("div"); attRow.appendChild(attach);
  if (ac.note) attRow.appendChild(el("div", "attnote", esc(ac.note) + ` Up to ${ac.max} files, ${ac.types}, ${ac.max_mb} MB each.`));
  c.appendChild(attRow);

  const showAll = el("button", "linkb", "Show all fields"); showAll.type = "button";
  showAll.onclick = () => {
    const open = all.style.display === "none";
    all.style.display = open ? "" : "none"; showAll.textContent = open ? "Hide fields" : "Show all fields";
    if (open) all.scrollIntoView({ block: "nearest" });
  };
  c.insertBefore(showAll, atts);

  let sendBtn2 = null;
  function valid() {
    const ok = !uploading && cb.ok() && (!ed.subject_required || subj.value.trim()) && (!ed.info_required || info.value.trim());
    if (sendBtn2) sendBtn2.disabled = !ok;
    return ok;
  }
  [subj, info, cb.num, cb.ext].forEach(x => x.addEventListener("input", () => { paintCb(); valid(); }));
  c.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { paintCb(); valid(); }));
  if (!cb.ok()) cbF.style.display = "";

  const btns = el("div", "btns");
  (card.actions || []).forEach(a => {
    const cls = a.style === "primary" ? "primary" : a.style === "alternative" ? "alt" : "";
    const btn = el("button", "b " + cls, esc(a.label));
    if (a.value === "confirm") {
      sendBtn2 = btn;
      btn.onclick = () => {
        if (busy || !valid()) return;
        const extra = { additional_info: info.value.trim(), callback: cb.value(), attachments: files };
        if (ed.has_subject !== false) extra.subject = subj.value.trim();
        lockCard(c, btn); c.querySelectorAll("input, textarea").forEach(i => i.disabled = true);
        send("confirm_with:" + JSON.stringify(extra), a.label);
      };
    } else btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
    btns.appendChild(btn);
  });
  btns.appendChild(el("span", "hint", "nothing has been sent yet"));
  c.appendChild(btns);
  paintCb(); drawAtts();
  return c;
}

// Opens one attachment in a new tab. The server checks the file belongs to this
// advisor's ticket and returns a link (Convex) or the file itself (local server).
async function viewAttachment(t, a, err) {
  err.textContent = "";
  const w = window.open("", "_blank");               // opened now, so it isn't blocked as a pop-up
  try {
    const q = `advisor=${encodeURIComponent(advisorSel.value)}&ticket=${encodeURIComponent(t.ticket_id)}&id=${encodeURIComponent(a.storage_id)}`;
    const res = await fetch(`/api/tickets/file?${q}`, { headers: demoHeaders() });
    const out = await res.json();
    if (!res.ok || !out.url) throw new Error(out.message || "not found");
    if (out.url.startsWith("/")) {                    // local server: fetch with the passcode
      const f = await fetch(out.url, { headers: demoHeaders() });
      if (!f.ok) throw new Error("not found");
      const url = URL.createObjectURL(await f.blob());
      if (w) w.location = url; else window.open(url, "_blank");
    } else if (w) w.location = out.url; else window.open(out.url, "_blank");
  } catch (e) {
    if (w) w.close();
    err.textContent = " The file could not be opened.";
  }
}

// Admin menu -> Active Tickets: this advisor's tickets; tap a row for the details.
function openTickets() {
  $("admmenu").classList.remove("open");
  const sheet = el("div", "sheet"), inner = el("div", "sheetin");
  const hd = el("div", "sheethd", `<b>Active Tickets · ${esc(advisorSel.value)}</b>`);
  const x = el("button", null, "×"); x.title = "Close"; x.onclick = () => sheet.remove();
  hd.appendChild(x);
  const bd = el("div", "sheetbd", '<div class="hint">Loading…</div>');
  inner.append(hd, bd); sheet.appendChild(inner);
  sheet.onclick = e => { if (e.target === sheet) sheet.remove(); };
  document.querySelector(".panel").appendChild(sheet);
  let rows = [];
  function list() {
    bd.innerHTML = "";
    if (!rows.length) { bd.appendChild(el("div", "hint", "No tickets yet.")); return; }
    rows.forEach(t => {
      const r = el("button", "trow",
        `<span class="sr">${esc(t.ticket_id)}</span><span>${esc(t.ticket)}</span><span class="st">${esc(t.status || "Sent")}</span>
         <span class="sub">${esc(t.client_name)} · ${esc(t.when)}</span>`);
      r.onclick = () => detail(t);
      bd.appendChild(r);
    });
  }
  function detail(t) {
    bd.innerHTML = "";
    const back = el("button", "back", "‹ All tickets"); back.onclick = list;
    const d = el("div", "tdet");
    d.appendChild(el("h4", null, esc(`${t.ticket_id} · ${t.ticket}`)));
    const f = el("div", "fields");
    [["Status", t.status || "Sent"], ["Sent", t.when], ["Client", t.client_name], ["Account", t.account]]
      .concat((t.fields || []).map(x => [x.label, x.value]))
      .filter(([, v]) => v)
      .forEach(([k, v]) => f.appendChild(el("div", null, `<span>${esc(k)}</span><span>${esc(v)}</span>`)));
    d.appendChild(f);
    if ((t.attachments || []).length) {                 // Attachments: View opens the file
      const box = el("div", "fields"); box.appendChild(el("div", null, "<span>Attachments</span><span></span>"));
      t.attachments.forEach(a => {
        const row = el("div", "att", `<span>${esc(a.name)}</span>`);
        const view = el("button", "linkb", "View"); view.type = "button";
        const err = el("span", "err"); err.style.fontSize = "12px";
        view.onclick = () => viewAttachment(t, a, err);
        row.append(view, err); box.appendChild(row);
      });
      d.appendChild(box);
    }
    bd.append(back, d);
  }
  fetch(`/api/tickets?advisor=${encodeURIComponent(advisorSel.value)}`, { headers: demoHeaders() })
    .then(r => r.json()).then(out => { rows = out.tickets || []; list(); })
    .catch(() => { bd.innerHTML = ""; bd.appendChild(el("div", "err", "The server is not reachable.")); });
}

function renderReply(r) {
  const card = r.card;
  if (r.status === "error" && !card) { addBot(el("div", "text err", esc(r.message))); return; }
  if (card && card.kind === "choice") {
    const wrap = el("div");
    wrap.appendChild(renderChoice(card));
    addBot(wrap, false); return;
  }
  if (card && card.kind === "confirm" && card.ticket) { addBot(renderTicketReview(card), false); return; }
  if (card && card.kind === "confirm") { addBot(renderConfirm(card), false); return; }
  if (card && card.kind === "check_form") { addBot(renderCheckForm(card), false); return; }
  if (card && card.kind === "callback_form") { addBot(renderCallback(card), false); return; }
  if (card && card.kind === "ticket_address") { addBot(renderTicketAddress(card), false); return; }
  if (card && card.kind === "fields_form") { addBot(renderFieldsForm(card), false); return; }
  if (card && card.kind === "check_status") { addBot(renderCheckStatus(card), false); return; }
  if (card && card.kind === "rollover_form") { addBot(renderRolloverForm(card), false); return; }
  if (card && card.kind === "address_input") { addBot(renderAddress(card), false); return; }
  if (card && card.kind === "client_input") { addBot(renderClientInput(card), false); return; }
  if (card && card.kind === "travel_form") { addBot(renderTravelForm(card), false); return; }
  if (card && card.kind === "text_input") { addBot(renderTextInput(card), false); return; }
  if (card && card.kind === "result") {
    const main = (r.message || "").split("\n")[0];
    addBot(el("div", "done", ICONS.check + `<span>${esc(main)}</span>`), !card.follow_up);
    if (card.follow_up && card.follow_up_actions) {        // F-25: Yes / No buttons
      addBot(renderChoice({ message: card.follow_up, actions: card.follow_up_actions }), false);
    } else if (card.follow_up) addBot(card.follow_up);
    return;
  }
  addBot(r.message || "");
}

function typing(on) {
  let t = $("typing");
  if (on && !t) { t = el("div", "bot"); t.id = "typing"; t.appendChild(el("div", "typing", "<i></i><i></i><i></i>")); msgs.appendChild(t); scroll(); }
  if (!on && t) t.remove();
}

// F-09: once the advisor moves on, earlier panels can no longer be clicked.
function retireOldPanels() {
  msgs.querySelectorAll(".card button:not(:disabled), .card input:not(:disabled), .card textarea:not(:disabled)").forEach(b => b.disabled = true);
}

async function send(utterance, display) {
  if (busy || !utterance.trim()) return;
  busy = true; sendBtn.disabled = true;
  retireOldPanels();
  addUser(display ?? utterance);
  typing(true);
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json", ...demoHeaders() },
      body: JSON.stringify({ advisor_id: advisorSel.value, conversation_id: conversationId, utterance, display: display ?? utterance })
    });
    const r = await res.json();
    typing(false); renderReply(r);
    if (res.status === 401 && window.DemoTools) window.DemoTools.askPasscode();
  } catch (e) {
    typing(false); addBot(el("div", "text err", "The demo server is not reachable. Is it still running?"));
  } finally { busy = false; sendBtn.disabled = false; input.focus(); }
}

function newConversation() {
  conversationId = advisorSel.value + ":" + Date.now();
  msgs.innerHTML = "";
  addBot(WELCOME);
}

function submit() { const t = input.value; input.value = ""; autosize(); send(t); }
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }

sendBtn.onclick = submit;
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
input.addEventListener("input", autosize);
advisorSel.onchange = () => { $("admmenu").classList.remove("open"); newConversation(); };
$("actions").onclick = () => { if (!busy) send("__actions__", "Actions"); };
$("adminbtn").onclick = e => { e.stopPropagation(); $("admmenu").classList.toggle("open"); };
$("admmenu").onclick = e => e.stopPropagation();
document.addEventListener("click", () => $("admmenu").classList.remove("open"));
$("ticketsbtn").onclick = openTickets;

function start() { newConversation(); input.focus(); }

// Demo-only hook: the hosted team demo adds a passcode screen and a reset bar
// (web/demo-tools.js). The product never needs it; without DEMO_MODE and
// DEMO_PASSCODE the server does not offer that file and this does nothing.
function demoHeaders() { return (window.DemoTools && window.DemoTools.headers()) || {}; }
window.NetXChat = { start, newConversation };

fetch("/api/info").then(r => r.json()).then(info => {
  (info.advisors || ["ADV-1234"]).forEach(a => advisorSel.appendChild(new Option(a, a, false, a === info.default_advisor)));
  $("rlabel").textContent = "Understanding: " + info.runtime_label;
  if (info.runtime === "gpt") $("rdot").classList.add("ai");
  if (info.demo_mode || info.passcode_required) {
    const sc = document.createElement("script");
    sc.src = "/demo-tools.js";
    sc.onload = () => window.DemoTools.init(info);
    document.body.appendChild(sc);
  } else {
    start();
  }
}).catch(() => { $("rlabel").textContent = "Server not reachable"; });
</script>
