<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetX AI — debit card demo</title>
<!--
  Mock of the NetX AI chat panel in NetX360, for the debit card demo.
  It only displays what the server returns. Every decision is made server-side
  (core/guardrails.py); this page sends the advisor's text or the value of the
  button they clicked, and draws the reply.

  The copy / download / retry / speaker icons, the "+" and mic buttons, the
  menu, the expand icon and the "Guide Me" tab are drawn for realism only and
  do nothing.
-->
<style>
  :root {
    --bg: #F5F8FC; --border: #D5DDE8; --pill: #DCE6F4; --text: #2B2F36;
    --head: #1F2D4A; --blue: #2F5D9A; --blue-tint: #E8EFF9; --hint: #8A93A0;
    --icon: #4A4F57; --green: #2E7D5B; --green-tint: #EEF4F2; --red: #B03030;
    --red-tint: #FBEFEF; --red-line: #E3B5B5; --page: #E6EBF2; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--text);
    font-family: "Segoe UI", Calibri, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    /* Exactly one screen tall (dvh = the visible part on phones); the page never
       scrolls, only the messages inside the panel do. */
    height: 100vh; height: 100dvh; overflow: hidden; padding: 16px;
  }
  /* Auto margins centre the group when there is room and never push it off-screen. */
  #demo-slot { width: 100%; max-width: 440px; flex: none; margin-top: auto; }
  .panel {
    position: relative; width: 100%; max-width: 440px;
    flex: 1 1 auto; min-height: 0; max-height: 860px;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--bg) 100%);
    border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column; box-shadow: 0 8px 28px rgba(31,45,74,.12);
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px;
  }
  header .title { font-weight: 700; color: var(--head); font-size: 15px; white-space: nowrap; }
  .info { font-size: 12.5px; color: var(--head); background: var(--blue-tint); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  header .spark { width: 18px; height: 18px; color: #3A73C9; }
  header .grow { flex: 1; }
  header .icon { width: 18px; height: 18px; color: var(--text); opacity: .85; }
  .advisor {
    font: inherit; font-size: 12px; color: var(--head); background: var(--white);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; cursor: pointer;
  }
  .runtime {
    font-size: 11px; color: var(--hint); padding: 0 14px 6px; display: flex; gap: 6px; align-items: center;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); }
  .dot.ai { background: #3A73C9; }
  .msgs {
    flex: 1; overflow-y: auto; padding: 8px 30px 8px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .user {
    align-self: flex-end; max-width: 80%; background: var(--pill); color: var(--text);
    padding: 8px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; white-space: pre-wrap;
  }
  .bot { align-self: stretch; font-size: 14px; line-height: 1.45; }
  .bot .text { white-space: pre-wrap; }
  .tools { display: flex; gap: 14px; margin-top: 6px; color: var(--icon); }
  .tools svg { width: 16px; height: 16px; }
  .card {
    background: var(--white); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-top: 2px; max-width: 94%;
  }
  .card.danger { border-color: var(--red-line); }
  .card h4 { margin: 0 0 6px; font-size: 14px; color: var(--head); }
  .card .q { font-weight: 700; color: var(--head); margin-bottom: 8px; }
  .fields { margin: 0 0 8px; font-size: 13.5px; }
  .fields div { display: flex; gap: 8px; padding: 2px 0; }
  .fields span:first-child { color: var(--hint); min-width: 92px; }
  .warn { font-style: italic; font-size: 13px; color: var(--hint); margin-bottom: 8px; }
  .danger .warn { color: var(--red); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opts.stack { grid-template-columns: 1fr; }
  button.b {
    font: inherit; font-size: 13px; cursor: pointer; border-radius: 999px; padding: 6px 14px;
    border: 1px solid var(--border); background: var(--white); color: var(--hint);
  }
  button.b.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .danger button.b.primary { background: var(--red); border-color: var(--red); }
  button.b.alt { border-color: var(--blue); color: var(--blue); font-weight: 600; }
  button.b.opt {
    border-radius: 8px; border-color: var(--border); color: var(--blue); text-align: center; padding: 8px 10px;
  }
  button.b.opt.picked { background: var(--blue-tint); border: 1.5px solid var(--blue); font-weight: 600; }
  button.b:disabled { cursor: default; opacity: .55; }
  button.b.opt.picked:disabled, button.b.chosen:disabled { opacity: 1; }
  .hint { font-size: 11.5px; color: var(--hint); font-style: italic; }
  .dates { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .dates .dq { font-weight: 600; color: var(--head); font-size: 13px; margin-bottom: 8px; }
  .dates .row2 { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .dates label { display: flex; flex-direction: column; font-size: 12px; color: var(--hint); gap: 3px; }
  .dates input { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); background: var(--white); }
  .dates .dh { font-size: 11.5px; color: var(--hint); margin-bottom: 8px; }
  .dates .dh.err { color: var(--red); }
  .notice { font-size: 12.5px; color: var(--red); margin-bottom: 8px; }
  .okline { display: flex; gap: 6px; color: var(--green); font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .okline svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
  .ack { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--text);
    margin: 4px 0 10px; cursor: pointer; }
  .ack input { margin-top: 2px; width: 16px; height: 16px; flex: none; }
  .addr input { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); background: var(--white); margin-bottom: 6px; }
  .addr .sugs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
  .addr .sug { text-align: left; border: 1px solid var(--border); border-radius: 8px; background: var(--white);
    padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; color: var(--text); }
  .addr .sug b { color: var(--head); font-weight: 600; }
  .addr .sug span { color: var(--hint); }
  .addr .sug:hover { border-color: var(--blue); background: var(--blue-tint); }
  .addr .pw { font-size: 10.5px; color: var(--hint); margin-bottom: 8px; }
  @media (max-width: 600px) { .addr input { font-size: 16px; } }
  .actbtn { font-weight: 600; color: var(--blue); border-color: var(--blue); }
  .cancelrow { margin-top: 8px; }
  button.b.cancel { color: var(--hint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-tint);
    border: 1px solid var(--blue); color: var(--head); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; }
  .chip button { border: 0; background: transparent; color: var(--hint); cursor: pointer; font-size: 14px; padding: 0 4px; }
  .field { margin-bottom: 8px; }
  .field .lbl { font-size: 12px; color: var(--hint); margin-bottom: 3px; }
  .field input, .field textarea { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: var(--white); }
  .field textarea { min-height: 54px; resize: vertical; }
  .field .err { font-size: 12px; margin-top: 3px; }
  @media (max-width: 600px) { .field input, .field textarea, .dates input { font-size: 16px; } }
  .done { display: flex; gap: 8px; align-items: flex-start; color: var(--green); font-weight: 600; }
  .done svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .err { color: var(--red); }
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--hint); animation: b 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .guide {
    position: absolute; right: -1px; top: 38%; background: var(--head); color: #fff;
    writing-mode: vertical-rl; font-size: 11px; font-weight: 700; padding: 10px 5px;
    border-radius: 6px 0 0 6px; user-select: none;
  }
  .composer { padding: 8px 14px 4px; }
  .box {
    background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px 6px;
  }
  .box textarea {
    width: 100%; border: 0; outline: 0; resize: none; font: inherit; font-size: 14px;
    color: var(--text); background: transparent; min-height: 22px; max-height: 120px;
  }
  .box .row { display: flex; align-items: center; gap: 10px; }
  .box .row .grow { flex: 1; }
  .box .row svg { width: 20px; height: 20px; }
  .plus { color: var(--blue); } .mic { color: var(--hint); }
  .send {
    width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--blue); color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .send:disabled { opacity: .5; cursor: default; }
  .send svg { width: 16px; height: 16px; }
  .note { font-size: 10.5px; color: var(--hint); text-align: center; padding: 6px 14px 10px; line-height: 1.35; }
  .below { font-size: 11px; color: #6B7684; margin-top: 10px; text-align: center; flex: none; margin-bottom: auto; }
  @media (max-width: 600px) {
    body { padding: 8px 8px max(8px, env(safe-area-inset-bottom)); }
    .panel { border-radius: 10px; }
    .below { display: none; }
    .msgs { padding-right: 26px; }
    /* 16px stops iPhone Safari from zooming in when you tap the box */
    .box textarea, .advisor { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="demo-slot"></div>
<div class="panel">
  <header>
    <svg class="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><path d="M5 2l.6 1.4L7 4l-1.4.6L5 6l-.6-1.4L3 4l1.4-.6z"/></svg>
    <span class="title">NetX AI</span>
    <span class="grow"></span>
    <button id="actions" class="advisor actbtn" title="Pick a card action">Actions</button>
    <select id="advisor" class="advisor" title="Signed-in advisor (mock)"></select>
    <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
  </header>
  <div class="runtime"><span id="rdot" class="dot"></span><span id="rlabel">Connecting…</span></div>
  <div id="msgs" class="msgs" aria-live="polite"></div>
  <div class="guide">Guide Me</div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Ask NetX AI"></textarea>
      <div class="row">
        <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span class="grow"></span>
        <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <button id="send" class="send" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
    </div>
  </div>
  <div class="note">Please note: AI can make mistakes. You are responsible for verifying accuracy of responses. All data shown here is synthetic.</div>
</div>
<div class="below">Demo · mock clients and cards · nothing reaches a real bank system</div>

<script>
const ICONS = {
  tools: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
       + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
       + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>'
       + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
};
const WELCOME = "Hi, I can help with your clients' debit cards: lock, unlock, replace, close permanently, report lost or stolen, travel notices, and the addresses cards are sent to. Type a request, or tap Actions.";

const $ = (id) => document.getElementById(id);
const msgs = $("msgs"), input = $("input"), sendBtn = $("send"), advisorSel = $("advisor");
let conversationId = null, busy = false;

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function scroll() { msgs.scrollTop = msgs.scrollHeight; }

function addUser(text) { msgs.appendChild(el("div", "user", esc(text))); scroll(); }

function addBot(inner, withTools = true) {
  const b = el("div", "bot");
  if (typeof inner === "string") b.appendChild(el("div", "text", esc(inner))); else b.appendChild(inner);
  if (withTools) b.appendChild(el("div", "tools", ICONS.tools));
  msgs.appendChild(b); scroll(); return b;
}

function lockCard(cardEl, chosenBtn) {
  cardEl.querySelectorAll("button").forEach(b => b.disabled = true);
  if (chosenBtn) chosenBtn.classList.add(chosenBtn.classList.contains("opt") ? "picked" : "chosen");
}

function renderChoice(card) {
  const c = el("div", "card");
  topLines(c, card);
  if (card.title) c.appendChild(el("h4", null, esc(card.title)));
  if (card.message) c.appendChild(el("div", "q", esc(card.message)));
  const all = card.actions || [];
  const acts = all.filter(a => a.style !== "cancel");
  const longest = Math.max(0, ...acts.map(a => a.label.length));
  const opts = el("div", "opts" + (acts.length > 2 || longest > 22 ? " stack" : ""));
  acts.forEach(a => {
    const btn = el("button", "b opt", esc(a.label));
    btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
    opts.appendChild(btn);
  });
  c.appendChild(opts);
  cancelRow(c, all);
  return c;
}

// P-12: every card has a Cancel button (its own row, under the options).
function cancelRow(c, actions, extra) {
  const row = el("div", "btns cancelrow");
  (extra || []).forEach(b => row.appendChild(b));
  (actions || []).filter(a => a.style === "cancel").forEach(a => {
    const btn = el("button", "b cancel", esc(a.label));
    btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
    row.appendChild(btn);
  });
  if (row.children.length) c.appendChild(row);
}

function cardHead(c, card) {
  topLines(c, card);
  if (card.title) c.appendChild(el("h4", null, esc(card.title)));
  if (card.message) c.appendChild(el("div", "q", esc(card.message)));
}

// A text field with suggestions fetched while typing. pick(s) is called with one suggestion.
function suggestField(input, box, url, show, pick) {
  let timer = null, seq = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const text = input.value.trim();
    if (text.length < 1) { box.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      try {
        const res = await fetch(url(text), { headers: demoHeaders() });
        const out = await res.json();
        if (mine !== seq) return;
        box.innerHTML = "";
        (out.suggestions || []).forEach(sg => {
          const b = el("button", "sug", show(sg));
          b.onclick = () => { if (!busy) pick(sg); };
          box.appendChild(b);
        });
        if (!(out.suggestions || []).length) box.appendChild(el("div", "hint", "No match yet - keep typing."));
      } catch (e) { box.innerHTML = ""; }
    }, 200);
  });
}

// P-16/P-17: "Which client?" - only this advisor's clients are suggested.
function renderClientInput(card) {
  const c = el("div", "card addr");
  cardHead(c, card);
  const q = el("input"); q.type = "text"; q.placeholder = "Start typing the client's name…"; q.autocomplete = "off";
  const sugs = el("div", "sugs");
  c.appendChild(q); c.appendChild(sugs);
  suggestField(q, sugs, t => `/api/clients/suggest?advisor=${encodeURIComponent(advisorSel.value)}&q=${encodeURIComponent(t)}`,
    sg => esc(sg.label), sg => { lockCard(c); q.disabled = true; send(`client_pick:${sg.id}`, sg.label.split(" · ")[0]); });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && q.value.trim() && !busy) { e.preventDefault(); lockCard(c); q.disabled = true; send(q.value.trim()); }
  });
  cancelRow(c, card.actions);
  setTimeout(() => q.focus(), 50);
  return c;
}

// Two date fields: From / To, no past dates, at most maxDays (both days counted).
function dateFields(parent, start, end, maxDays) {
  const today = isoLocal(new Date());
  const box = el("div", "dates",
    `<div class="row2"><label>From<input type="date" class="ds"></label><label>To<input type="date" class="de"></label></div>
     <div class="dh">Up to ${maxDays} days, no past dates.</div>`);
  const s = box.querySelector(".ds"), e = box.querySelector(".de"), h = box.querySelector(".dh");
  s.min = today; e.min = today;
  if (start) s.value = start; if (end) e.value = end;
  function check() {
    h.className = "dh"; h.textContent = `Up to ${maxDays} days, no past dates.`;
    if (s.value) { e.min = s.value; e.max = addDays(s.value, maxDays - 1); }
    if (!s.value || !e.value) return false;
    if (s.value < today) { h.className = "dh err"; h.textContent = "The start date is in the past."; return false; }
    if (e.value < s.value) { h.className = "dh err"; h.textContent = "The end date is before the start date."; return false; }
    if (e.value > addDays(s.value, maxDays - 1)) { h.className = "dh err"; h.textContent = `A travel notice can cover at most ${maxDays} days.`; return false; }
    return true;
  }
  parent.appendChild(box);
  return { s, e, check, box };
}

// P-02/03/04/09: destinations (from BNY's list, with suggestions) and dates on one card.
function renderTravelForm(card) {
  const c = el("div", "card addr");
  cardHead(c, card);
  const max = card.max_destinations || 10;
  let dests = [...(card.destinations || [])];
  const fld = el("div", "field"); fld.appendChild(el("div", "lbl", `Destinations (countries or US states, up to ${max})`));
  const chips = el("div", "chips"), q = el("input"), sugs = el("div", "sugs");
  q.type = "text"; q.placeholder = "Type a country or US state…"; q.autocomplete = "off";
  fld.appendChild(chips); fld.appendChild(q); fld.appendChild(sugs); c.appendChild(fld);
  function drawChips() {
    chips.innerHTML = "";
    dests.forEach((d, i) => {
      const ch = el("span", "chip", esc(d)); const x = el("button", null, "×"); x.title = "Remove";
      x.onclick = () => { dests.splice(i, 1); drawChips(); valid(); };
      ch.appendChild(x); chips.appendChild(ch);
    });
    q.disabled = dests.length >= max;
    q.placeholder = dests.length >= max ? `Up to ${max} destinations` : "Type a country or US state…";
  }
  suggestField(q, sugs, t => `/api/places/suggest?q=${encodeURIComponent(t)}`, sg => esc(sg),
    sg => { if (!dests.includes(sg) && dests.length < max) dests.push(sg); q.value = ""; sugs.innerHTML = ""; drawChips(); valid(); q.focus(); });
  const df = dateFields(c, card.start, card.end, card.max_days || 14);
  const go = el("button", "b primary", "Continue");
  function valid() { const ok = dests.length > 0 && df.check(); go.disabled = !ok; return ok; }
  df.s.addEventListener("change", valid); df.e.addEventListener("change", valid);
  go.onclick = () => {
    if (busy || !valid()) return;
    lockCard(c, go); c.querySelectorAll("input").forEach(i => i.disabled = true);
    send("travel_form:" + JSON.stringify({ destinations: dests, start: df.s.value, end: df.e.value }),
         `${dests.join(", ")}, ${niceDate(df.s.value)} to ${niceDate(df.e.value)}`);
  };
  drawChips(); valid();
  cancelRow(c, card.actions, [go]);
  return c;
}

// P-11: one required text box (e.g. what "Other" means).
function renderTextInput(card) {
  const c = el("div", "card");
  cardHead(c, card);
  const fld = el("div", "field"), t = el("textarea");
  t.placeholder = card.placeholder || ""; t.maxLength = 200;
  fld.appendChild(t); c.appendChild(fld);
  const go = el("button", "b primary", esc(card.submit || "Continue"));
  const ok = () => t.value.trim().length >= 3;
  go.disabled = true; t.oninput = () => { go.disabled = !ok(); };
  go.onclick = () => { if (busy || !ok()) return; lockCard(c, go); t.disabled = true; send("text_input:" + t.value.trim(), t.value.trim()); };
  cancelRow(c, card.actions, [go]);
  setTimeout(() => t.focus(), 50);
  return c;
}

// F-22: Change dates opens a date-range picker inside the panel. Past dates are
// disabled and the end date can be at most max_days after the start (counting
// both days). The server checks the same rules again.
function isoLocal(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoLocal(d); }
function niceDate(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }

function datePicker(cardEl, d) {
  const old = cardEl.querySelector(".dates");
  if (old) { old.remove(); return; }
  const max = d.max_days || 14, today = isoLocal(new Date());
  const box = el("div", "dates",
    `<div class="dq">Pick the travel dates</div>
     <div class="row2"><label>From<input type="date" class="ds"></label><label>To<input type="date" class="de"></label></div>
     <div class="dh">Up to ${max} days, no past dates.</div>`);
  const s = box.querySelector(".ds"), e = box.querySelector(".de"), h = box.querySelector(".dh");
  s.min = today; s.value = d.start && d.start >= today ? d.start : today;
  function sync() {
    if (!s.value || s.value < today) s.value = today;
    e.min = s.value; e.max = addDays(s.value, max - 1);
    if (!e.value || e.value < e.min) e.value = d.end && d.end >= e.min && d.end <= e.max ? d.end : e.min;
    if (e.value > e.max) e.value = e.max;
    h.className = "dh"; h.textContent = `Up to ${max} days, no past dates.`;
  }
  s.onchange = sync; e.onchange = sync; sync();
  const use = el("button", "b primary", "Use these dates");
  use.onclick = () => {
    if (busy) return;
    if (!s.value || !e.value || e.value < s.value) { h.className = "dh err"; h.textContent = "Pick a start and an end date."; return; }
    lockCard(cardEl, use);
    send(`set_dates:${s.value}:${e.value}`, `New dates: ${niceDate(s.value)} to ${niceDate(e.value)}`);
  };
  box.appendChild(use);
  cardEl.appendChild(box);
  box.scrollIntoView({ block: "nearest" });
}

function topLines(c, card) {
  if (card.note) c.appendChild(el("div", "okline", ICONS.check + `<span>${esc(card.note)}</span>`));
  if (card.notice) c.appendChild(el("div", "notice", esc(card.notice)));
  if (card.info) c.appendChild(el("div", "info", esc(card.info)));
}

// Address field with suggestions while typing (US + territories). The server
// looks the picked address up again; the browser only sends the suggestion id.
function renderAddress(card) {
  const c = el("div", "card addr");
  topLines(c, card);
  if (card.title) c.appendChild(el("h4", null, esc(card.title)));
  if (card.message) c.appendChild(el("div", "q", esc(card.message)));
  const q = el("input"); q.type = "text"; q.placeholder = "Start typing an address…"; q.autocomplete = "off";
  const apt = el("input"); apt.type = "text"; apt.placeholder = "Apt, suite, unit (optional)"; apt.autocomplete = "off";
  const sugs = el("div", "sugs"), pw = el("div", "pw", "");
  c.appendChild(q); c.appendChild(apt); c.appendChild(sugs); c.appendChild(pw);
  const session = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[^a-zA-Z0-9-]/g, "");
  let timer = null, seq = 0;
  q.oninput = () => {
    clearTimeout(timer);
    const text = q.value.trim();
    if (text.length < 3) { sugs.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      try {
        const res = await fetch(`/api/address/suggest?q=${encodeURIComponent(text)}&session=${session}`, { headers: demoHeaders() });
        const out = await res.json();
        if (mine !== seq) return;
        sugs.innerHTML = "";
        pw.textContent = out.provider === "google" ? "Suggestions powered by Google" : "Demo address list";
        if (!(out.suggestions || []).length) { sugs.appendChild(el("div", "hint", "No matching US address yet - keep typing.")); return; }
        out.suggestions.forEach(sg => {
          const b = el("button", "sug", `<b>${esc(sg.main || sg.text)}</b> <span>${esc(sg.secondary || "")}</span>`);
          b.onclick = () => {
            if (busy) return;
            const unit = apt.value.trim().replace(/[|]/g, " ");
            lockCard(c, b);
            send(`address_pick:${sg.id}|${unit}`, sg.text + (unit ? ` (${unit})` : ""));
          };
          sugs.appendChild(b);
        });
      } catch (e) { sugs.innerHTML = ""; sugs.appendChild(el("div", "hint", "Address search is not available right now.")); }
    }, 250);
  };
  const btns = el("div", "btns");
  (card.actions || []).forEach(a => {
    const btn = el("button", "b", esc(a.label));
    btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
    btns.appendChild(btn);
  });
  c.appendChild(btns);
  setTimeout(() => q.focus(), 50);
  return c;
}

function renderConfirm(card) {
  const c = el("div", "card" + (card.danger ? " danger" : ""));
  topLines(c, card);
  c.appendChild(el("h4", null, esc(card.title)));
  const inlineDates = card.dates && card.dates.inline;
  const f = el("div", "fields");
  (card.fields || []).filter(x => !(inlineDates && x.label === "Dates"))
    .forEach(x => f.appendChild(el("div", null, `<span>${esc(x.label)}</span><span>${esc(x.value)}</span>`)));
  c.appendChild(f);
  let df = null, reason = null, reasonErr = null, tick = null;
  if (inlineDates) df = dateFields(c, card.dates.start, card.dates.end, card.dates.max_days || 14);   // P-14
  if (card.text_input) {                            // P-06: required, editable text box
    const ti = card.text_input, fld = el("div", "field");
    fld.appendChild(el("div", "lbl", esc(ti.label) + (ti.required ? " (required)" : "")));
    reason = el("input"); reason.type = "text"; reason.maxLength = 200;
    reason.placeholder = ti.placeholder || ""; reason.value = ti.value || "";
    reasonErr = el("div", "err");
    fld.appendChild(reason); fld.appendChild(reasonErr); c.appendChild(fld);
  }
  if (card.warning) c.appendChild(el("div", "warn", esc(card.warning)));
  if (card.ack) {                                   // a box the advisor must tick first
    const lab = el("label", "ack");
    tick = el("input"); tick.type = "checkbox";
    lab.appendChild(tick); lab.appendChild(el("span", null, esc(card.ack)));
    c.appendChild(lab);
  }
  const btns = el("div", "btns");
  (card.actions || []).forEach(a => {
    const cls = a.style === "primary" ? "primary" : a.style === "alternative" ? "alt" : "";
    const btn = el("button", "b " + cls, esc(a.label));
    if (a.value === "change_dates" && card.dates) btn.onclick = () => { if (!busy) datePicker(c, card.dates); };
    else if (a.value === "confirm" && (tick || reason || df)) {
      const ready = () => (!tick || tick.checked) && (!reason || reason.value.trim().length >= 3)
                          && (!df || df.check());
      btn.disabled = !ready();
      [tick, reason, df && df.s, df && df.e].forEach(x => x && x.addEventListener(x === reason ? "input" : "change",
                                                                                 () => { btn.disabled = !ready(); }));
      btn.onclick = () => {
        if (busy || !ready()) return;
        const extra = {};
        if (tick) extra.ack = true;
        if (reason) extra.reason = reason.value.trim();
        if (df) { extra.start = df.s.value; extra.end = df.e.value; }
        lockCard(c, btn); c.querySelectorAll("input").forEach(i => i.disabled = true);
        send("confirm_with:" + JSON.stringify(extra), a.label);
      };
    }
    else btn.onclick = () => { if (busy) return; lockCard(c, btn); send(a.value, a.label); };
    btns.appendChild(btn);
  });
  btns.appendChild(el("span", "hint", "nothing has run yet"));
  c.appendChild(btns);
  return c;
}

function renderReply(r) {
  const card = r.card;
  if (r.status === "error" && !card) { addBot(el("div", "text err", esc(r.message))); return; }
  if (card && card.kind === "choice") {
    const wrap = el("div");
    wrap.appendChild(renderChoice(card));
    addBot(wrap, false); return;
  }
  if (card && card.kind === "confirm") { addBot(renderConfirm(card), false); return; }
  if (card && card.kind === "address_input") { addBot(renderAddress(card), false); return; }
  if (card && card.kind === "client_input") { addBot(renderClientInput(card), false); return; }
  if (card && card.kind === "travel_form") { addBot(renderTravelForm(card), false); return; }
  if (card && card.kind === "text_input") { addBot(renderTextInput(card), false); return; }
  if (card && card.kind === "result") {
    const main = (r.message || "").split("\n")[0];
    addBot(el("div", "done", ICONS.check + `<span>${esc(main)}</span>`), !card.follow_up);
    if (card.follow_up && card.follow_up_actions) {        // F-25: Yes / No buttons
      addBot(renderChoice({ message: card.follow_up, actions: card.follow_up_actions }), false);
    } else if (card.follow_up) addBot(card.follow_up);
    return;
  }
  addBot(r.message || "");
}

function typing(on) {
  let t = $("typing");
  if (on && !t) { t = el("div", "bot"); t.id = "typing"; t.appendChild(el("div", "typing", "<i></i><i></i><i></i>")); msgs.appendChild(t); scroll(); }
  if (!on && t) t.remove();
}

// F-09: once the advisor moves on, earlier panels can no longer be clicked.
function retireOldPanels() {
  msgs.querySelectorAll(".card button:not(:disabled), .card input:not(:disabled), .card textarea:not(:disabled)").forEach(b => b.disabled = true);
}

async function send(utterance, display) {
  if (busy || !utterance.trim()) return;
  busy = true; sendBtn.disabled = true;
  retireOldPanels();
  addUser(display ?? utterance);
  typing(true);
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json", ...demoHeaders() },
      body: JSON.stringify({ advisor_id: advisorSel.value, conversation_id: conversationId, utterance })
    });
    const r = await res.json();
    typing(false); renderReply(r);
    if (res.status === 401 && window.DemoTools) window.DemoTools.askPasscode();
  } catch (e) {
    typing(false); addBot(el("div", "text err", "The demo server is not reachable. Is it still running?"));
  } finally { busy = false; sendBtn.disabled = false; input.focus(); }
}

function newConversation() {
  conversationId = advisorSel.value + ":" + Date.now();
  msgs.innerHTML = "";
  addBot(WELCOME);
}

function submit() { const t = input.value; input.value = ""; autosize(); send(t); }
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }

sendBtn.onclick = submit;
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
input.addEventListener("input", autosize);
advisorSel.onchange = newConversation;
$("actions").onclick = () => { if (!busy) send("__actions__", "Actions"); };

function start() { newConversation(); input.focus(); }

// Demo-only hook: the hosted team demo adds a passcode screen and a reset bar
// (web/demo-tools.js). The product never needs it; without DEMO_MODE and
// DEMO_PASSCODE the server does not offer that file and this does nothing.
function demoHeaders() { return (window.DemoTools && window.DemoTools.headers()) || {}; }
window.NetXChat = { start, newConversation };

fetch("/api/info").then(r => r.json()).then(info => {
  (info.advisors || ["ADV-1234"]).forEach(a => advisorSel.appendChild(new Option(a, a, false, a === info.default_advisor)));
  $("rlabel").textContent = "Understanding: " + info.runtime_label;
  if (info.runtime === "gpt") $("rdot").classList.add("ai");
  if (info.demo_mode || info.passcode_required) {
    const sc = document.createElement("script");
    sc.src = "/demo-tools.js";
    sc.onload = () => window.DemoTools.init(info);
    document.body.appendChild(sc);
  } else {
    start();
  }
}).catch(() => { $("rlabel").textContent = "Server not reachable"; });
</script>
